          title: DCS_Name_Simplified_Chinese
          type:
            - string
            - "null"
          maxLength: 34
        DCS_Name_Traditional_Chinese:
          description: "Publisher field type: esriFieldTypeString"
          title: DCS_Name_Traditional_Chinese
          type:
            - string
            - "null"
          maxLength: 34
        OBJECTID:
          description: "Publisher field type: esriFieldTypeOID"
          title: OBJECTID
          type: integer
      additionalProperties: true
    ArcgisFeatureServerArcgisFeatureSet:
      type: object
      properties:
        features:
          type: array
          items:
            type: object
            properties:
              attributes:
                $ref: "#/components/schemas/ArcgisFeatureServerArcgisLayer0Attributes"
