  /server/services/common/td_rcd_1638949160594_2844/MapServer/WMSServer:
    get:
      operationId: WmsMapServerGetMap
      tags:
        - WMS
      summary: Render a map image
      description: Map rendering returns its advertised native image/document representation. It does not return a feature JSON collection. Layer CRS, style and bounding-box choices are retained; no data observation is implied by metadata availability.
      parameters:
        - name: service
          in: query
          required: true
          description: OGC service identifier.
          schema:
            type: string
            enum:
              - WMS
          example: WMS
        - name: version
          in: query
          required: true
          description: Exact advertised WMS version.
          schema:
            type: string
            enum:
              - 1.3.0
          example: 1.3.0
        - name: request
          in: query
          required: true
          description: Read-only GetMap operation.
          schema:
            type: string
            enum:
              - GetMap
          example: GetMap
        - name: layers
          in: query
          required: true
          description: Comma-separated published map layer names. Values are publisher identifiers; examples are choices, not a closed enumeration. The full ID/title directory is in x-csdi-layer-choices.
          schema:
            type: string
          examples:
            choice1:
              summary: SPEED_LIMIT
              value: SPEED_LIMIT
            choice2:
              summary: PEDESTRIAN_ZONE
              value: PEDESTRIAN_ZONE
            choice3:
              summary: NSR
              value: NSR
            choice4:
              summary: BUS_ONLY_LANE
              value: BUS_ONLY_LANE
            choice5:
              summary: CENTERLINE
              value: CENTERLINE
            choice6:
              summary: TURN
              value: TURN
            choice7:
              summary: VEHICLE_RESTRICTION
              value: VEHICLE_RESTRICTION
            choice8:
              summary: TRAFFIC_FEATURES
              value: TRAFFIC_FEATURES
            choice9:
              summary: RUN_IN_OUT
              value: RUN_IN_OUT
            choice10:
              summary: ROUNDABOUT
              value: ROUNDABOUT
            choice11:
              summary: PROHIBITION
              value: PROHIBITION
            choice12:
              summary: PERMIT
              value: PERMIT
            choice13:
              summary: INTERSECTION
              value: INTERSECTION
            choice14:
              summary: ONSTREETPARK
              value: ONSTREETPARK
          x-choice-count: 14
        - name: styles
          in: query
          required: true
          description: Comma-separated style names; an empty string selects the standard default style.
          schema:
            type: string
          example: ""
          allowEmptyValue: true
        - name: format
          in: query
          required: true
          description: Advertised GetMap representation.
          schema:
            type: string
            enum:
              - image/bmp
              - image/jpeg
              - image/tiff
              - image/png
              - image/png8
              - image/png24
              - image/png32
              - image/gif
              - image/svg+xml
          example: image/png
        - name: width
          in: query
          required: true
          description: Requested image width in pixels; no invented maximum.
          schema:
            type: integer
          example: 256
        - name: height
          in: query
          required: true
          description: Requested image height in pixels; no invented maximum.
          schema:
            type: integer
          example: 256
        - name: crs
          in: query
          required: true
          description: Advertised coordinate reference system; support depends on selected layer. Observe the WMS version and CRS axis order.
          schema:
            type: string
          example: CRS:84
        - name: bbox
          in: query
          required: true
          description: minx,miny,maxx,maxy in the chosen CRS and its specified axis order. Example, when present, is an actual advertised bounding box.
          schema:
            type: string
          example: 113.847113,22.205640,114.369465,22.560146
      responses:
        "200":
          description: Native publisher response; protocol or business errors may also be returned. Metadata connection and actual data-query success are separate.
          content:
            image/bmp:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/tiff:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/png8:
              schema:
                type: string
                format: binary
            image/png24:
              schema:
                type: string
                format: binary
            image/png32:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/svg+xml:
              schema:
                type: string
                format: binary
      externalDocs:
        url: https://portal.csdi.gov.hk/csdi-webpage/doc/GeoSpatialServices
      x-advertised-crss:
        - CRS:84
        - EPSG:4326
        - EPSG:2326
        - EPSG:102140
      servers:
        - url: https://portal.csdi.gov.hk
      x-native-source-evidence:
        - url: https://portal.csdi.gov.hk/server/services/common/td_rcd_1638949160594_2844/MapServer/WMSServer?service=wms&request=GetCapabilities
          sha256: 830e4d924a8b0444b996e42b5589bff19c7ae9b84bc54ecac5fd4bc5a07a3372
          httpStatus: 200
          contentType: text/xml
          role: wms-capabilities
          parseStatus: pass
          kind: wms-capabilities
