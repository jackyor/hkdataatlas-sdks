          title: ROAD_ROUTE_ID
          type: integer
        C_ROUTE_ID:
          description: "Publisher field type: esriFieldTypeInteger"
          title: C_ROUTE_ID
          type: integer
        C_ROUTE_TYPE:
          description: "Publisher field type: esriFieldTypeSmallInteger"
          title: C_ROUTE_TYPE
          type:
            - integer
            - "null"
        LAST_UPD_DATE_G:
          description: "Publisher field type: esriFieldTypeDate; JSON wire representation remains unknown."
          title: LAST_UPD_DATE_G
        Shape__Length:
          description: "Publisher field type: esriFieldTypeDouble"
          title: Shape_Length
          type:
            - number
            - "null"
      additionalProperties: true
    ArcgisFeatureServerArcgisFeatureSet:
