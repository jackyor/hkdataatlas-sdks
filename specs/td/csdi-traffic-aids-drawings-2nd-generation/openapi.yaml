openapi: 3.1.0
info:
  title: Transport Department — Traffic Aids Drawings (2nd generation)
  version: csdi-native-readonly-v1
  description: Deterministic derivative of retained native CSDI metadata. Read-only GET operations are selected only where native capabilities and protocol documentation support them. Publisher originals remain separate. Successful metadata retrieval does not prove current data-query success, complete response fields or all layer combinations.
paths:
  /server/rest/services/common/td_rcd_1638928986276_39755/FeatureServer/{layerId}/query:
    get:
      operationId: ArcgisFeatureServerQueryFeatures
      tags:
        - ArcGIS REST
      summary: Query published features
      description: Read-only GET query follows the source-advertised Query capability. One parameterized operation covers all queryable layers. Metadata field types are declared without inventing universally required attributes. Omitted f may produce the native REST default representation, which is not asserted as a JSON payload.
      parameters:
        - name: layerId
          in: path
          required: true
          description: Published queryable layer or table. Values are publisher identifiers; examples are choices, not a closed enumeration. The full ID/title directory is in x-csdi-layer-choices.
          schema:
            type: integer
          examples:
            choice1:
              summary: DTAD_RD_AL_LINE
              value: 0
            choice2:
              summary: DTAD_DROP_KERB_LINE
              value: 1
            choice3:
              summary: DTAD_TS_POLE_PT
              value: 10
            choice4:
              summary: DTAD_TS_POLE_LINE
              value: 11
            choice5:
              summary: DTAD_TS_FILLED
              value: 12
            choice6:
              summary: DTAD_TS_ABV_PT
              value: 13
            choice7:
              summary: DTAD_TS_ABV_LINE
              value: 14
            choice8:
              summary: DTAD_TS_MISC_LINE
              value: 15
            choice9:
              summary: DTAD_TS_PLATE_LINE
              value: 16
            choice10:
              summary: DTAD_TG_PATH_LINE
              value: 17
            choice11:
              summary: DTAD_RAILING_LINE
              value: 18
            choice12:
              summary: DTAD_YL_BOX_LINE
              value: 19
            choice13:
              summary: DTAD_RUN_IN_OUT_LINE
              value: 2
            choice14:
              summary: DTAD_YL_BOX_POLY
              value: 20
            choice15:
              summary: DTAD_CROSSING_LINE
              value: 21
            choice16:
              summary: DTAD_RD_MARK_LINE
              value: 24
            choice17:
              summary: DTAD_RD_MARK_LINE_C
              value: 25
            choice18:
              summary: DTAD_RD_MARK_SYM_LINE
              value: 26
            choice19:
              summary: DTAD_RD_MARK_SYM_PT
              value: 27
            choice20:
              summary: DTAD_LV22_LINE
              value: 28
            choice21:
              summary: DTAD_LV22_FILLED
              value: 29
            choice22:
              summary: DTAD_PED_REFUGE_LINE
              value: 3
            choice23:
              summary: DTAD_TRAFFIC_LIGHT_PT
              value: 32
            choice24:
              summary: DTAD_TRAFFIC_LIGHT_LINE
              value: 33
            choice25:
              summary: DTAD_TRAFFIC_LIGHT_FILLED
              value: 34
          x-choice-count: 48
        - name: f
          in: query
          required: false
          description: Advertised query representation. Supply this selector for the represented JSON/GeoJSON/PBF responses.
          schema:
            type: string
            enum:
              - json
              - geojson
              - pbf
          example: json
        - name: where
          in: query
          required: false
          description: SQL WHERE expression over the published fields; source protocol supports this read-only query filter.
          schema:
            type: string
          example: 1=1
        - name: outFields
          in: query
          required: false
          description: Comma-separated source field names, or *. Field schemas are conditional on the selected layer and returned fields.
          schema:
            type: string
          example: "*"
        - name: returnGeometry
          in: query
          required: false
          description: Whether native feature geometry should be included.
          schema:
            type: boolean
          example: false
        - name: resultRecordCount
          in: query
          required: false
          description: Bound returned records where the selected layer advertises pagination; no global range is inferred.
          schema:
            type: integer
          example: 1
          x-supported-layer-ids:
            - 0
            - 1
            - 10
