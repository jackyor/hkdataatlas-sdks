info:
  title: Citybus Next Bus API
  version: "2.01"
  description: Current publisher v2.01 request contract and v2.01 data dictionary. Response field types are documented; numeric/string coordinate alternatives and route-list wrapper are supported by retained complete current bodies. Optional fields and open objects preserve undocumented omissions/extensions.
servers:
  - url: https://rt.data.gov.hk
paths:
  /v2/transport/citybus/company/{company_id}:
    get:
      operationId: getCitybusCompany
      summary: Company information
      parameters:
        - name: company_id
          in: path
          required: true
          description: Citybus company ID. All former NWFB routes are available under CTB.
          schema:
            type: string
            enum:
              - CTB
      x-publisher-source-pages:
        - 5
      responses:
        "200":
          description: Success. Documented optional fields; empty data object/array denotes no match. Observed string coordinates retained.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getCitybusCompanyResponse"
        "422":
          description: API execution error; see response body.
          content:
            application/json:
              schema: {}
        "429":
          description: Processing too many requests.
          content:
            application/json:
              schema: {}
        "500":
          description: Internal Server Error.
          content:
            application/json:
              schema: {}
