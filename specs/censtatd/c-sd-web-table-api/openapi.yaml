openapi: 3.0.3
info:
  title: APIs for C&SD Web Tables
  description: These are the APIs for C&SD Web Tables
  version: 1.0.0
servers:
  - url: https://www.censtatd.gov.hk/api
tags:
  - name: statisticalTables
    description: Get full series statistics for Web Tables
paths:
  /get.php:
    get:
      tags:
        - statisticalTables
      summary: Retrieve the statistics for Web Tables
      description: Returns the requested C&SD Web Tables in JSON format.
      operationId: getStatisticalTable
      parameters:
        - name: id
          in: query
          description: |
            Web Table code (`table_id`), e.g. `110-01001`.
            Only one table may be requested per call.
            Choose a known table below, or supply another publisher table ID.

            <details>
            <summary>Table IDs and titles</summary>

