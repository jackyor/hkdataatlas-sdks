        - name: lang
          in: query
          description: |
            Language of the textual descriptions.
            Only `en` | `tc` | `sc` are allowed (case-insensitive; prefer lowercase).
          required: true
          schema:
            type: string
            enum:
              - en
              - tc
              - sc
        - name: full_series
          in: query
          required: true
          description: |
            Set to `"1"` for the full series.
            This parameter is served as validation as well.
          schema:
            type: string
            enum:
              - "1"
      responses:
        "200":
          description: successful request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableResponse"
        "404":
          description: Resource not found
        4XX:
          description: Client error
        5XX:
          description: Server error
components:
  schemas:
    TableResponse:
      type: object
      required:
        - header
      properties:
        header:
          $ref: "#/components/schemas/Header"
        dataSet:
          type: array
          description: |
            Array of observation records.
            Present only on a successful request, with the description of the query being "Query Success".
            It may be omitted or empty on failure.
          items:
            $ref: "#/components/schemas/DataRecord"
    Header:
      type: object
      required:
        - status
        - count
      properties:
        status:
          $ref: "#/components/schemas/Status"
        title:
          type: string
          description: Web Table Title
        tablenote:
          type: array
          description: Footnotes and explanatory notes (language-dependent)
          items:
            type: string
        source:
          type: string
          description: Data source and contact information
        count:
          $ref: "#/components/schemas/Count"
    Status:
      type: object
      required:
        - name
        - code
        - description
      properties:
        name:
          type: string
          enum:
            - Success
            - Fail
        code:
          type: integer
          description: |
            0 = Query success
            1 = Validation error
          enum:
            - 0
            - 1
        description:
          type: string
        message:
          oneOf:
            - type: string
              nullable: true
            - type: array
              items:
                type: string
              nullable: true
          description: |
            Error detail(s) when `code = 1`.
            Null, omitted, or empty on success.
        apiHelp:
