components:
  schemas:
    Header:
      title: Header
      type: object
      properties:
        success:
          type: boolean
        err_code:
          type: string
        err_msg:
          type: string
    Response:
      title: response
      type: object
      properties:
        header:
          $ref: "#/components/schemas/Header"
        result:
          $ref: "#/components/schemas/Result"
    Result:
      title: Result
      type: object
      properties:
        datasize:
          type: integer
          format: int32
        records:
          type: array
          items:
            $ref: "#/components/schemas/Record"
          description: ""
    Record:
      title: Record
      type: object
      properties:
        end_of_month:
          type: string
          description: Reportingperiod is returned asYYYY-MM; preserve plainstrings including full dates without inventing aday or pattern.
        hkd_drmkt_outstand_efbn:
          type: number
        hkd_drmkt_outstand_odrinst:
          type: number
          nullable: true
          description: Retained officialresponses use null when this statistical value is unavailable.
        hkd_drmkt_outstand_total:
          type: number
          nullable: true
          description: Retained officialresponses use null when this statistical value is unavailable.
        hkd_drmkt_new_non_efbn:
          type: number
          nullable: true
          description: Retained officialresponses use null when this statistical value is unavailable.
        eq_mkt_hs_index:
          type: number
        eq_mkt_ttl_stock_cap:
          type: number
        eq_mkt_fund_raised:
          type: number
    Sortorder:
      title: sortorder
      enum:
