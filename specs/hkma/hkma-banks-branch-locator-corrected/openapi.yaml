    get:
      summary: Retrieve information of Bank's Branches
      parameters:
        - name: lang
          in: query
          description: ""
          required: true
          style: form
          explode: true
          schema:
            $ref: "#/components/schemas/Lang"
        - name: pagesize
          in: query
          description: ""
