          schema:
            type: integer
            format: int32
        - name: offset
          in: query
          description: ""
          style: form
          explode: true
          schema:
            type: integer
            format: int32
        - name: fields
          in: query
          description: ""
          style: form
          explode: true
          schema:
            type: string
        - name: column
          in: query
          description: ""
          style: form
          explode: true
          schema:
            type: string
        - name: filter
          in: query
          description: ""
          style: form
          explode: true
          schema:
            type: string
        - name: choose
          in: query
          description: ""
          style: form
          explode: true
          schema:
            type: string
        - name: from
          in: query
          description: ""
          style: form
          explode: true
          schema:
            type: string
        - name: to
          in: query
          description: ""
          style: form
          explode: true
          schema:
            type: string
        - name: sortby
          in: query
          description: ""
          style: form
          explode: true
          schema:
            type: string
        - name: sortorder
          in: query
          description: ""
          style: form
          explode: true
          schema:
            $ref: "#/components/schemas/Sortorder"
      responses:
        "200":
          description: Expected response to a valid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response"
        "500":
          description: Unexcpeted error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    Header:
      title: Header
      type: object
      properties:
        success:
          type: boolean
        err_code:
          type: string
        err_msg:
          type: string
    Response:
      title: response
      type: object
      properties:
        header:
          $ref: "#/components/schemas/Header"
        result:
          $ref: "#/components/schemas/Result"
    Result:
      title: Result
      type: object
      properties:
        datasize:
          type: integer
          format: int32
        records:
          type: array
          items:
            $ref: "#/components/schemas/Record"
          description: ""
    Record:
      title: Record
      type: object
      properties:
        issue_date:
          type: string
          format: date
        average_yield_accepted:
          type: number
        amount_applied:
          type: number
        over_subscription:
          type: number
    Sortorder:
      title: sortorder
      enum:
        - asc
        - desc
      type: string
      example: asc
      x-enum-elements:
        - name: asc
          description: ""
        - name: desc
          description: ""
    Segment:
      title: segment
      enum:
        - 28day
        - 91day
        - 182day
        - 364day
      type: string
      example: 28day
      x-enum-elements:
        - name: 28-day
          description: ""
        - name: 91-day
          description: ""
        - name: 182-day
          description: ""
        - name: 364-day
          description: ""
    ErrorResponse:
      title: errorResponse
      type: object
      properties:
        header:
          $ref: "#/components/schemas/Header"
