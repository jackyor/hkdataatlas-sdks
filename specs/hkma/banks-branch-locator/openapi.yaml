components:
  schemas:
    Header:
      title: Header
      type: object
      properties:
        success:
          type: boolean
        err_code:
          type: string
        err_msg:
          type: string
    Response:
      title: response
      type: object
      properties:
        header:
          $ref: "#/components/schemas/Header"
        result:
          $ref: "#/components/schemas/Result"
    Result:
      title: Result
      type: object
      properties:
        datasize:
          type: integer
          format: int32
        records:
          type: array
          items:
            $ref: "#/components/schemas/Record"
          description: ""
    Record:
      title: Record
      type: object
      properties:
        district:
          type: string
        bank_name:
          type: string
        branch_name:
          type: string
        address:
          type: string
        service_hours:
          type: string
          nullable: true
          description: Retained officialrecords use null when this information is unavailable.
        latitude:
          anyOf:
            - type: number
            - type: string
          description: Documentednumber or retained officialnumericstring, preserved without coercion; lexical constraints are unspecified.
        longitude:
          anyOf:
            - type: number
            - type: string
          description: Documentednumber or retained officialnumericstring, preserved without coercion; lexical constraints are unspecified.
        barrier-free_access:
          type: string
          nullable: true
          description: Retained officialrecords use null when this information is unavailable.
    Sortorder:
      title: sortorder
      enum:
        - asc
        - desc
      type: string
      example: asc
      x-enum-elements:
        - name: asc
          description: ""
        - name: desc
          description: ""
    Lang:
      title: lang
      enum:
        - en
        - tc
        - sc
      type: string
      example: en
      x-enum-elements:
        - name: en
          description: Data in English
        - name: tc
          description: Data in Traditional Chinese
        - name: sc
          description: Data in Simplified Chinese
    ErrorResponse:
      title: errorResponse
      type: object
      properties:
        header:
          $ref: "#/components/schemas/Header"
