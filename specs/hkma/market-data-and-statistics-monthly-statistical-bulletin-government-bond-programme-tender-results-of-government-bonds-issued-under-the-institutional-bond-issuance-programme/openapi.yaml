components:
  schemas:
    ErrorResponse:
      properties:
        header:
          $ref: "#/components/schemas/Header"
      title: errorResponse
      type: object
    Header:
      properties:
        err_code:
          type: string
        err_msg:
          type: string
        success:
          type: boolean
      title: Header
      type: object
    Record:
      properties:
        amount_allotted:
          type: number
        amount_applied:
          type: number
        average_yield_accepted:
          type: number
        bid-to-cover_ratio:
          type: number
        coupon:
          type: number
        expected_maturity_date:
          format: date
          type: string
        issue_date:
          format: date
          type: string
        issue_number:
          type: string
        ni_ro:
          type: string
      title: Record
      type: object
    Response:
      properties:
        header:
          $ref: "#/components/schemas/Header"
        result:
          $ref: "#/components/schemas/Result"
      title: response
      type: object
    Result:
      properties:
        datasize:
          format: int32
          type: integer
        records:
          description: ""
          items:
            $ref: "#/components/schemas/Record"
          type: array
      title: Result
      type: object
    Segment:
      enum:
        - 2year
        - 3year
        - 5year
        - 10year
        - 15year
      example: 2year
      title: segment
      type: string
      x-enum-elements:
        - description: ""
          name: 2-year
        - description: ""
          name: 3-year
        - description: ""
          name: 5-year
        - description: ""
          name: 10-year
        - description: ""
          name: 15-year
    Sortorder:
      enum:
        - asc
        - desc
      example: asc
      title: sortorder
      type: string
      x-enum-elements:
        - description: ""
          name: asc
        - description: ""
          name: desc
