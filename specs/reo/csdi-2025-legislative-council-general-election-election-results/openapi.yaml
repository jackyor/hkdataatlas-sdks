  /server/services/common/reo_rcd_1698719457267_2433/MapServer/WFSServer:
    get:
      operationId: WfsMapServerGetFeature
      tags:
        - WFS
      summary: Retrieve published features
      description: One read-only GET operation selects published feature types by name. Attribute types derive from retained DescribeFeatureType XSD when available; missing XSD, geometry, unread response data and unknown fields remain explicit limitations.
      parameters:
        - name: service
          in: query
          required: true
          description: OGC service identifier.
          schema:
            type: string
            enum:
              - WFS
          example: WFS
        - name: version
          in: query
          required: true
          description: Exact capabilities version.
          schema:
            type: string
            enum:
              - 2.0.0
          example: 2.0.0
        - name: request
          in: query
          required: true
          description: Read-only operation advertised by GetCapabilities.
          schema:
            type: string
            enum:
              - GetFeature
          example: GetFeature
        - name: typeNames
          in: query
          required: true
          description: Published feature type names; multiple selections follow the advertised protocol syntax. Values are publisher identifiers; examples are choices, not a closed enumeration. The full ID/title directory is in x-csdi-layer-choices.
          schema:
            type: string
          examples:
            choice1:
              summary: RESULT_2025LCGE_LC10
              value: csdi:RESULT_2025LCGE_LC10
            choice2:
              summary: RESULT_2025LCGE_LC9
              value: csdi:RESULT_2025LCGE_LC9
            choice3:
              summary: RESULT_2025LCGE_LC8
              value: csdi:RESULT_2025LCGE_LC8
            choice4:
              summary: RESULT_2025LCGE_LC7
              value: csdi:RESULT_2025LCGE_LC7
            choice5:
              summary: RESULT_2025LCGE_LC6
              value: csdi:RESULT_2025LCGE_LC6
            choice6:
              summary: RESULT_2025LCGE_LC5
              value: csdi:RESULT_2025LCGE_LC5
            choice7:
              summary: RESULT_2025LCGE_LC4
              value: csdi:RESULT_2025LCGE_LC4
            choice8:
              summary: RESULT_2025LCGE_LC3
              value: csdi:RESULT_2025LCGE_LC3
            choice9:
              summary: RESULT_2025LCGE_LC2
              value: csdi:RESULT_2025LCGE_LC2
            choice10:
              summary: RESULT_2025LCGE_LC1
              value: csdi:RESULT_2025LCGE_LC1
          x-choice-count: 10
        - name: outputFormat
          in: query
          required: false
          description: Advertised native representation; JSON, GML, CSV and images are kept distinct.
          schema:
            type: string
            enum:
              - GML32
              - GML32+ZIP
              - GML32+GZIP
              - application/gml+xml; version=3.2
              - GML3
              - GML3+ZIP
              - GML3+GZIP
              - text/xml; subtype=gml/3.1.1
              - GML2
              - GML2+ZIP
              - GML2+GZIP
              - text/xml; subtype=gml/2.1.2
              - GEOJSON
              - GEOJSON+ZIP
              - GEOJSON+GZIP
              - ESRIGEOJSON
              - ESRIGEOJSON+ZIP
              - ESRIGEOJSON+GZIP
              - KML
              - application/vnd.google-earth.kml xml
              - application/vnd.google-earth.kml+xml
              - KMZ
              - application/vnd.google-earth.kmz
              - SHAPE+ZIP
              - CSV
              - CSV+ZIP
              - CSV+GZIP
              - Geopackage
              - Geopackage+ZIP
          example: GEOJSON
        - name: count
          in: query
          required: false
          description: OGC bounded feature limit; example requests one feature without claiming a server-wide bound.
          schema:
            type: integer
          example: 1
        - name: srsName
          in: query
          required: false
          description: Output CRS choices advertised by at least one feature type; support may vary by selected type.
          schema:
            type: string
          example: urn:ogc:def:crs:EPSG::2326
      responses:
        "200":
          description: Native publisher response; protocol or business errors may also be returned. Metadata connection and actual data-query success are separate.
          content:
            application/gml+xml:
              schema:
                type: string
            text/xml:
              schema:
                type: string
            application/json:
              schema:
                $ref: "#/components/schemas/WfsMapServerWfsFeatureCollection"
            application/geo+json:
              schema:
                $ref: "#/components/schemas/WfsMapServerWfsFeatureCollection"
            application/vnd.google-earth.kml+xml:
              schema:
                type: string
            "*/*":
              schema:
                description: Native Geopackage+ZIP output; wire media type/fields are not constrained.
            text/csv:
              schema:
                type: string
                description: Native CSV; row/column wire conformance is not inferred from JSON schemas.
      externalDocs:
        url: https://docs.ogc.org/is/09-025r2/09-025r2.html
      x-advertised-crss:
        - urn:ogc:def:crs:EPSG::2326
      servers:
        - url: https://portal.csdi.gov.hk
      x-native-source-evidence:
        - url: https://portal.csdi.gov.hk/server/services/common/reo_rcd_1698719457267_2433/MapServer/WFSServer?service=wfs&request=GetCapabilities
          sha256: de58f149c0e71b383bc526edc9076494f93a04d7ddc5ca49591df0bfe02d1565
          httpStatus: 200
          contentType: text/xml;charset=UTF-8
          role: wfs-capabilities
          parseStatus: pass
          kind: wfs-capabilities
  /server/services/common/reo_rcd_1698719457267_2433/MapServer/WMSServer:
    get:
      operationId: WmsMapServerGetMap
      tags:
        - WMS
      summary: Render a map image
      description: Map rendering returns its advertised native image/document representation. It does not return a feature JSON collection. Layer CRS, style and bounding-box choices are retained; no data observation is implied by metadata availability.
      parameters:
        - name: service
          in: query
          required: true
          description: OGC service identifier.
          schema:
            type: string
            enum:
              - WMS
          example: WMS
        - name: version
          in: query
          required: true
          description: Exact advertised WMS version.
          schema:
            type: string
            enum:
              - 1.3.0
          example: 1.3.0
        - name: request
          in: query
          required: true
          description: Read-only GetMap operation.
          schema:
            type: string
            enum:
              - GetMap
          example: GetMap
        - name: layers
          in: query
          required: true
          description: Comma-separated published map layer names. Values are publisher identifiers; examples are choices, not a closed enumeration. The full ID/title directory is in x-csdi-layer-choices.
          schema:
            type: string
          examples:
            choice1:
              summary: RESULT_2025LCGE_LC1
              value: RESULT_2025LCGE_LC1
            choice2:
              summary: RESULT_2025LCGE_LC2
              value: RESULT_2025LCGE_LC2
            choice3:
              summary: RESULT_2025LCGE_LC3
              value: RESULT_2025LCGE_LC3
            choice4:
              summary: RESULT_2025LCGE_LC4
              value: RESULT_2025LCGE_LC4
            choice5:
              summary: RESULT_2025LCGE_LC5
              value: RESULT_2025LCGE_LC5
            choice6:
              summary: RESULT_2025LCGE_LC6
              value: RESULT_2025LCGE_LC6
            choice7:
              summary: RESULT_2025LCGE_LC7
              value: RESULT_2025LCGE_LC7
            choice8:
              summary: RESULT_2025LCGE_LC8
              value: RESULT_2025LCGE_LC8
            choice9:
              summary: RESULT_2025LCGE_LC9
              value: RESULT_2025LCGE_LC9
            choice10:
              summary: RESULT_2025LCGE_LC10
              value: RESULT_2025LCGE_LC10
          x-choice-count: 10
        - name: styles
          in: query
          required: true
          description: Comma-separated style names; an empty string selects the standard default style.
          schema:
            type: string
          example: ""
          allowEmptyValue: true
        - name: format
          in: query
          required: true
          description: Advertised GetMap representation.
          schema:
            type: string
            enum:
              - image/bmp
              - image/jpeg
              - image/tiff
              - image/png
              - image/png8
              - image/png24
              - image/png32
              - image/gif
              - image/svg+xml
          example: image/png
        - name: width
          in: query
          required: true
          description: Requested image width in pixels; no invented maximum.
          schema:
            type: integer
          example: 256
        - name: height
          in: query
          required: true
          description: Requested image height in pixels; no invented maximum.
          schema:
            type: integer
          example: 256
        - name: crs
          in: query
          required: true
          description: Advertised coordinate reference system; support depends on selected layer. Observe the WMS version and CRS axis order.
          schema:
            type: string
          example: CRS:84
        - name: bbox
          in: query
          required: true
          description: minx,miny,maxx,maxy in the chosen CRS and its specified axis order. Example, when present, is an actual advertised bounding box.
          schema:
            type: string
          example: 113.858470,22.206295,114.274025,22.548133
      responses:
        "200":
          description: Native publisher response; protocol or business errors may also be returned. Metadata connection and actual data-query success are separate.
          content:
            image/bmp:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/tiff:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/png8:
              schema:
                type: string
                format: binary
            image/png24:
              schema:
                type: string
                format: binary
            image/png32:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/svg+xml:
              schema:
                type: string
                format: binary
      externalDocs:
        url: https://portal.csdi.gov.hk/csdi-webpage/doc/GeoSpatialServices
      x-advertised-crss:
        - CRS:84
        - EPSG:4326
        - EPSG:2326
        - EPSG:102140
      servers:
        - url: https://portal.csdi.gov.hk
      x-native-source-evidence:
        - url: https://portal.csdi.gov.hk/server/services/common/reo_rcd_1698719457267_2433/MapServer/WMSServer?service=wms&request=GetCapabilities
          sha256: 633d3ca227f9f026529ba1e17eb49fd6cb70dba1ab5c05e337183b82334483ec
          httpStatus: 200
          contentType: text/xml
          role: wms-capabilities
          parseStatus: pass
          kind: wms-capabilities
