              value: 23
            choice18:
              summary: RESULT_2023DCOE_L3
              value: 24
            choice19:
              summary: RESULT_2023DCOE_M1
              value: 25
            choice20:
              summary: RESULT_2023DCOE_M2
              value: 26
            choice21:
              summary: RESULT_2023DCOE_M3
              value: 27
            choice22:
              summary: RESULT_2023DCOE_M4
              value: 28
            choice23:
              summary: RESULT_2023DCOE_N1
              value: 29
            choice24:
              summary: RESULT_2023DCOE_C1
              value: 3
            choice25:
              summary: RESULT_2023DCOE_N2
              value: 30
          x-choice-count: 44
        - name: f
          in: query
          required: false
          description: Advertised query representation. Supply this selector for the represented JSON/GeoJSON/PBF responses.
          schema:
            type: string
            enum:
              - json
              - geojson
              - pbf
          example: json
        - name: where
          in: query
          required: false
          description: SQL WHERE expression over the published fields; source protocol supports this read-only query filter.
          schema:
            type: string
          example: 1=1
        - name: outFields
          in: query
          required: false
          description: Comma-separated source field names, or *. Field schemas are conditional on the selected layer and returned fields.
          schema:
            type: string
          example: "*"
        - name: returnGeometry
          in: query
          required: false
          description: Whether native feature geometry should be included.
          schema:
            type: boolean
          example: false
        - name: resultRecordCount
          in: query
          required: false
          description: Bound returned records where the selected layer advertises pagination; no global range is inferred.
          schema:
            type: integer
          example: 1
          x-supported-layer-ids:
