info:
  description: Publisher documentation provides a response field dictionary and a sample response, but does not document an HTTP method or request contract. The catalogue associates the dataset with the literal JSON resource URL https://api.clp.com.hk/evcharger/list; that association does not establish an executable HTTP operation, request parameters, authentication, or a universal response contract. The information version is undocumented and is not a publisher API version.
  title: Electric Vehicle Charging Stations
  version: undocumented
openapi: 3.1.0
paths:
  /evcharger/list:
    get:
      operationId: retrieveElectricVehicleChargingStationsJsonEvchargerList
      summary: Retrieve Electric Vehicle Charging Stations (JSON)
      description: Read-only retrieval of the exact publisher-listed JSON resource https://api.clp.com.hk/evcharger/list. This is a published data-file link; no additional hosted API or URL template is asserted. Dictionary components describe contextual record fields without establishing the complete payload shape. Authentication is unspecified.
      servers:
        - url: https://api.clp.com.hk
      responses:
        "200":
          description: Published JSON resource; successful retrieval status is the HTTP representation, availability has not been tested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SampleResponse"
servers:
  - description: Catalogue-associated resource host; no API server base or operation is specified in the documentation.
    url: https://api.clp.com.hk
