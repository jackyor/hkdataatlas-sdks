  schemas:
    Charger:
      properties:
        chargerType:
          description: 'Documented values: Quick, SemiQuick. The sample spells a value as "Semi-Quick", which differs from the dictionary spelling.'
          type: string
        cpNo:
          description: Unique identifier for the charger.
          type: string
        cpStatus:
          description: "Documented values: Charging_Not_Available, Status_Not_Available, Charging_Available, Charger_Out_of_Service."
          type: string
        itemId:
          description: Unique identifier for the charger, as described by the dictionary.
          type: string
        lastUpdate:
          description: Last update timestamp. The dictionary labels this as date and gives an example with a timezone offset; the sample uses a space-separated timestamp without an offset. No format is asserted.
          type: string
        pointName:
          description: Name of the charging point; the sample includes an empty string.
          type: string
        provider:
          description: "Documented value: CLP."
          type: string
      type: object
    Data:
      properties:
        geoLocationResult:
          items:
            $ref: "#/components/schemas/GeoLocationResult"
          type: array
        totalSearchResult:
          description: Number of geoLocationResult objects.
          type: integer
      type: object
    GeoLocationResult:
      properties:
        chargerList:
          description: List of charger objects.
          items:
            $ref: "#/components/schemas/Charger"
          type: array
        detailedAddress:
          description: Full address of the location.
          type: string
        distance:
          description: Distance from the location of access versus the charging station. The dictionary says this is currently a placeholder and that actual distance logic may be added later; the sample shows "0".
          type: string
        districtItemId:
          description: Identifier for the district.
          type: string
        itemId:
          description: Unique identifier.
          type: string
        lastUpdate:
          description: Last update timestamp for the location. Dictionary labels this as date; its sample is a date-time string (2025-12-08 15:36:04), so no specific format is asserted.
          type: string
        latitude:
          description: Latitude in decimal degrees (for example, 22.3193).
          type: number
        longitude:
          description: Longitude in decimal degrees (for example, 114.1694).
          type: number
        provider:
          description: "Documented value: CLP."
          type: string
        status:
          description: "Location status. Documented values: Status_Not_Available, Charging_Not_Available, Charging_Available."
          type: string
        title:
          description: Item title.
          type: string
        totalNumberOfAvailableCharger:
          description: Number of available chargers.
          type: integer
        totalNumberOfAvailableQuickCharger:
          description: Number of available quick chargers.
          type: integer
        totalNumberOfAvailableSemiQuickCharger:
          description: Number of available semi-quick chargers.
          type: integer
        totalNumberOfCharger:
          description: Total number of chargers at the location.
          type: integer
        totalNumberOfNotAvailableCharger:
          description: "Dictionary description: number of not-available semi-quick chargers. The field name suggests a total across charger types; the documented wording is retained as written."
          type: integer
        totalNumberOfNotAvailableQuickCharger:
          description: Number of not-available quick chargers.
          type: integer
        totalNumberOfNotAvailableSemiQuickCharger:
          description: Number of not-available semi-quick chargers.
          type: integer
        totalNumberOfOutOfServiceCharger:
          description: Number of out-of-service chargers.
          type: integer
        totalNumberOfOutOfServiceQuickCharger:
          description: Number of out-of-service quick chargers.
          type: integer
        totalNumberOfOutOfServiceSemiQuickCharger:
          description: Number of out-of-service semi-quick chargers.
          type: integer
        totalNumberOfQuickCharger:
          description: Total number of quick chargers.
          type: integer
        totalNumberOfSemiQuickCharger:
          description: Total number of semi-quick chargers.
          type: integer
        totalNumberOfStatusNotAvailableCharger:
          description: Number of chargers with status not available.
          type: integer
      type: object
    SampleResponse:
      description: Response structure described by the field dictionary and illustrated by a bounded sample. The sample does not establish that this is a complete or universal response contract.
      properties:
        code:
          description: "HTTP response code; documented example: 200."
          type: integer
        data:
          $ref: "#/components/schemas/Data"
        message:
          description: "Response message; documented example: Success."
          type: string
      type: object
