components:
  schemas:
    BestTrackCsvRecord:
      description: Data row in the annual tropical cyclone best-track CSV. The documented dataset layout includes a dataset-name section before a header row; this schema describes the 12 data fields, not the preceding CSV metadata rows.
      examples:
        - - MALAKAS
          - 2022
          - 4
          - 7
          - 0
          - TD
          - 370
          - 14850
          - 1000
          - 25
          - "2201"
          - "0001"
      items:
        oneOf:
          - description: "Field 1: Tropical cyclone name."
            type: string
          - description: "Field 2: Year."
            type: integer
          - description: "Field 3: Month."
            type: integer
          - description: "Field 4: Day."
            type: integer
          - description: "Field 5: Time in UTC."
            type: integer
          - description: "Field 6: Intensity classification. The dataset uses the Hong Kong Observatory's classification, including the three typhoon categories applied consistently across years: Typhoon, Severe Typhoon, and Super Typhoon. The source example gives TD; it does not enumerate all intensity values."
            type: string
          - description: "Field 7: Latitude in units of 0.01 degree north."
            type: integer
          - description: "Field 8: Longitude in units of 0.01 degree east."
            type: integer
          - description: "Field 9: Estimated minimum central pressure in hPa."
            type: integer
          - description: "Field 10: Estimated maximum surface winds in knots."
            type: integer
          - description: "Field 11: JMA code. Source example: 2201."
            type: string
          - description: "Field 12: HKO code. Source example: 0001."
            type: string
      maxItems: 12
      minItems: 12
      type: array
info:
  description: The source documents the structure of annual CSV datasets, not an executable HTTP API. The version value is a metadata placeholder, not a publisher API version. The catalogue associates annual CSV download files with this dataset; it does not establish an API URL template, parameters, authentication, or a JSON response contract. Each CSV contains dataset-name rows, a header row, and data rows with 12 fields. Field meanings and units are described in the schema; CSV records are not represented here as JSON API responses.
  title: Tropical Cyclone Best Track Data (Post-analysis)
  version: undocumented
openapi: 3.1.0
