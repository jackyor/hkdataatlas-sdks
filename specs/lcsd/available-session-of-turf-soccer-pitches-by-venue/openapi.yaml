info:
  description: The publisher documents a data dictionary for turf soccer pitch availability and a catalogue-listed JSON resource URL, but does not document an HTTP operation, request parameters, or a complete response contract. The literal resource URL is included as a read-only GET retrieval link; no URL template or authentication behavior is specified. The metadata version value is a placeholder and is not a publisher API version.
  title: Available Session of Turf Soccer Pitches
  version: undocumented
openapi: 3.1.0
paths:
  /rest/cms/api/v1/publ/contents/open-data/turf-soccer-pitch/file:
    get:
      operationId: retrieveAvailableSessionOfTurfSoccerPitchesByVenueRestCmsApiV1PublContentsOpenDataTurfSoccerPitchFile
      summary: Retrieve Available Session of Turf Soccer Pitches by Venue
      description: Read-only retrieval of the exact publisher-listed JSON resource https://data.smartplay.lcsd.gov.hk/rest/cms/api/v1/publ/contents/open-data/turf-soccer-pitch/file. This is a published data-file link; no additional hosted API or URL template is asserted. Dictionary components describe contextual record fields without establishing the complete payload shape. Authentication is unspecified.
      servers:
        - url: https://data.smartplay.lcsd.gov.hk
      responses:
        "200":
          description: Published JSON resource; successful retrieval status is the HTTP representation, availability has not been tested.
          content:
            application/json:
              schema:
                description: Exact published resource retrieval. The complete payload/container shape is not specified; contextual field dictionaries are retained separately under components.
