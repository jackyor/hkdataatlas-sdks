components:
  schemas:
    AvailableBasketballCourtSessionFields:
      description: Field dictionary for the dataset. The source documents these fields and their meanings and types, but does not specify a complete response object, field requiredness, or whether fields can be absent or null.
      properties:
        Available_Courts:
          description: Count of available courts.
          type: number
        Available_Date:
          description: Available date, documented format yyyy-mm-dd.
          format: date
          type: string
        District_Name_EN:
          description: "District in English. Acceptable values: Central & Western, Eastern, Islands, Kowloon City, Kwai Tsing, Kwun Tong, North, Sai Kung, Sham Shui Po, Sha Tin, Southern, Tai Po, Tsuen Wan, Tuen Mun, Wan Chai, Wong Tai Sin, Yau Tsim Mong, Yuen Long."
          type: string
        District_Name_TC:
          description: "District in Traditional Chinese. Acceptable values: 中西區, 東區, 離島區, 九龍城區, 葵青區, 觀塘區, 北區, 西貢區, 深水埗區, 沙田區, 南區, 大埔區, 荃灣區, 屯門區, 灣仔區, 黃大仙區, 油尖旺區, 元朗區."
          type: string
        Facility_Location_Name_EN:
          description: Facility location in English.
          type: string
        Facility_Location_Name_TC:
          description: Facility location in Traditional Chinese.
          type: string
        Facility_Type_Name_EN:
          description: Facility type in English.
          type: string
        Facility_Type_Name_TC:
          description: Facility type in Traditional Chinese.
          type: string
        Session_End_Time:
          description: Available session end time, documented format hh:mm.
          type: string
        Session_Start_Time:
          description: Available session start time, documented format hh:mm.
          type: string
        Venue_Address_EN:
          description: Venue address in English. The source does not provide a more specific wire-type constraint.
        Venue_Address_TC:
          description: Venue address in Traditional Chinese. The source does not provide a more specific wire-type constraint.
        Venue_Latitude:
          description: Venue latitude. The source gives 2.17403 as an example, but does not specify a field data type.
        Venue_Longitude:
          description: Venue longitude. The source gives 41.40338 as an example, but does not specify a field data type.
        Venue_Name_EN:
          description: Venue name in English.
          type: string
        Venue_Name_TC:
          description: Venue name in Traditional Chinese.
          type: string
        Venue_Phone_No.:
          description: Venue telephone number. The source does not provide a more specific wire-type constraint.
      type: object
