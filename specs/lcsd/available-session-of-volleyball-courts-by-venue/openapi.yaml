components:
  schemas:
    AvailableVolleyballCourtSessionRecord:
      description: Dataset record fields documented by the publisher. The dictionary does not specify field requiredness or a complete response envelope.
      properties:
        Available_Courts:
          description: Available courts count; documented data type is Number.
          type: number
        Available_Date:
          description: Available date; documented format is yyyy-mm-dd.
          format: date
          type: string
        District_Name_EN:
          description: District in English.
          enum:
            - Central & Western
            - Eastern
            - Islands
            - Kowloon City
            - Kwai Tsing
            - Kwun Tong
            - North
            - Sai Kung
            - Sham Shui Po
            - Sha Tin
            - Southern
            - Tai Po
            - Tsuen Wan
            - Tuen Mun
            - Wan Chai
            - Wong Tai Sin
            - Yau Tsim Mong
            - Yuen Long
          type: string
        District_Name_TC:
          description: District in Traditional Chinese.
          enum:
            - 中西區
            - 東區
            - 離島區
            - 九龍城區
            - 葵青區
            - 觀塘區
            - 北區
            - 西貢區
            - 深水埗區
            - 沙田區
            - 南區
            - 大埔區
            - 荃灣區
            - 屯門區
            - 灣仔區
            - 黃大仙區
            - 油尖旺區
            - 元朗區
          type: string
        Facility_Location_Name_EN:
          description: Facility location in English.
          type: string
        Facility_Location_Name_TC:
          description: Facility location in Traditional Chinese.
          type: string
        Facility_Type_Name_EN:
          description: Facility type in English.
          type: string
        Facility_Type_Name_TC:
          description: Facility type in Traditional Chinese.
          type: string
        Session_End_Time:
          description: Available session end time; documented format is hh:mm.
          type: string
        Session_Start_Time:
          description: Available session start time; documented format is hh:mm.
          type: string
        Venue_Address_EN:
          description: Venue address in English.
          type: string
        Venue_Address_TC:
          description: Venue address in Traditional Chinese.
          type: string
        Venue_Latitude:
          description: Venue latitude. The dictionary gives the example 2.17403.
          type: number
        Venue_Longitude:
          description: Venue longitude. The dictionary gives the example 41.40338.
          type: number
        Venue_Name_EN:
          description: Venue name in English.
          type: string
        Venue_Name_TC:
          description: Venue name in Traditional Chinese.
          type: string
        Venue_Phone_No.:
          description: Venue telephone number. The dictionary gives the example 3954 5150.
          type: string
      type: object
