info:
  contact:
    name: Legislative Council
  description: The source bundle documents a voting-result data dictionary and associates the data with a catalogue collection endpoint, but does not document HTTP methods, request parameters, or the response envelope and wire-format structure. The catalogue's exact published JSON resource URL is available in the data dictionary's catalogue context. Authentication requirements are not specified. The version value is a metadata placeholder, not a publisher API version.
  license:
    name: undocumented
  title: Legislative Council Voting Result Database
  version: undocumented
openapi: 3.1.0
paths:
  /vrdb/odata/vVotingResult:
    get:
      operationId: retrieveTheVotingResultsOfTheFinanceCommitteeOfTheFifthLegislativeCouncil20122016VrdbOdataVvotingresult
      summary: Retrieve The voting results of the Finance Committee of the Fifth Legislative Council (2012 - 2016)
      description: Read-only retrieval of the exact publisher-listed XML resource https://app.legco.gov.hk/vrdb/odata/vVotingResult?$format=xml&$filter=type+eq+%27Finance+Committee%27+and+start_date+ge+datetime%272012-10-01%27+and+start_date+lt+datetime%272016-10-01%27&$inlinecount=allpages. This is a published data-file link; no additional hosted API or URL template is asserted. Dictionary components describe contextual record fields without establishing the complete payload shape. Authentication is unspecified.
      servers:
        - url: https://app.legco.gov.hk
      responses:
        "200":
          description: Published XML resource; successful retrieval status is the HTTP representation, availability has not been tested.
          content:
            application/xml:
              schema:
                description: Exact published resource retrieval. The complete payload/container shape is not specified; contextual field dictionaries are retained separately under components.
                type: string
      parameters:
        - name: $format
          in: query
          required: true
          schema:
            type: string
            enum:
              - xml
          description: Literal selector from the exact published resource URL; other values are unknown.
        - name: $filter
          in: query
          required: true
          schema:
            type: string
            enum:
              - type eq 'Finance Committee' and start_date ge datetime'2012-10-01' and start_date lt datetime'2016-10-01'
          description: Literal selector from the exact published resource URL; other values are unknown.
        - name: $inlinecount
          in: query
          required: true
          schema:
            type: string
            enum:
              - allpages
          description: Literal selector from the exact published resource URL; other values are unknown.
servers:
  - description: Base associated with the catalogue's voting-result collection resource; endpoint behavior beyond the literal published URL is undocumented.
    url: https://app.legco.gov.hk/vrdb/odata
externalDocs:
  description: Publisher data dictionary for voting-result fields. Catalogue records associate the data with the OData collection, but do not document its operation contract.
  url: https://www.legco.gov.hk/datagovhk/data-dictionary-votingresult-db-en.pdf
