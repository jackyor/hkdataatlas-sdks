components:
  schemas:
    Committee:
      description: Committee fields documented by the reference-data dictionary. Requiredness is not specified.
      properties:
        committee_code:
          description: "Code of the committee. Example: BC/1/19."
          examples:
            - BC/1/19
          type: string
        committee_id:
          description: "Committee identifier. Example: 3072."
          examples:
            - 3072
          type: number
        home_url_chi:
          description: URL of the Chinese home page of the committee. The PDF example contains line wrapping within the URL; it is shown here normalized as a continuous URL.
          examples:
            - https://www.legco.gov.hk/yr19-20/chinese/bc/bc01/general/bc01.htm
          format: uri
          type: string
        home_url_eng:
          description: URL of the English home page of the committee. The PDF example contains line wrapping within the URL; it is shown here normalized as a continuous URL.
          examples:
            - https://www.legco.gov.hk/yr19-20/english/bc/bc01/general/bc01.htm
          format: uri
          type: string
        name_chi:
          description: "Committee name in Chinese. Example: 《2019 年強制性公積金計劃(修訂)條例草案》委員會."
          examples:
            - 《2019 年強制性公積金計劃(修訂)條例草案》委員會
          type: string
        name_eng:
          description: "Committee name in English. Example: Bills Committee on Mandatory Provident Fund Schemes (Amendment) Bill 2019."
          examples:
            - Bills Committee on Mandatory Provident Fund Schemes (Amendment) Bill 2019
          type: string
        term_id:
          description: "Term identifier. Example: 5."
          examples:
            - 5
          type: number
      type: object
    Member:
      description: Member fields documented by the reference-data dictionary. Requiredness is not specified.
      properties:
        english_name:
          description: "English name of the Member. Example: Abraham."
          examples:
            - Abraham
          type: string
        firstname_chi:
          description: "First name of the Member in Chinese. Example: 禮謙."
          examples:
            - 禮謙
          type: string
        firstname_eng:
          description: "First name of the Member in English. Example: Lai-him."
          examples:
            - Lai-him
          type: string
        honourable_chi:
          description: "Honorific of the Member in Chinese. Example: GBS, JP."
          examples:
            - GBS, JP
          type: string
        honourable_eng:
          description: "Honorific of the Member in English. Example: GBS, JP."
          examples:
            - GBS, JP
          type: string
        latest_term_id:
          description: "The latest term that the Member belongs to. Example: 5."
          examples:
            - 5
          type: number
        member_id:
          description: "Member identifier. Example: 187."
          examples:
            - 187
          type: number
        seq_num:
          description: "Sequence number. Example: 4."
          examples:
            - 4
          type: number
        surname_chi:
          description: "Surname of the Member in Chinese. Example: 石."
          examples:
            - 石
          type: string
        surname_eng:
          description: "Surname of the Member in English. Example: SHEK."
          examples:
            - SHEK
          type: string
        title_chi:
          description: "Title of the Member in Chinese. Example: 議員."
          examples:
            - 議員
          type: string
        title_eng:
          description: "Title of the Member in English. Example: Hon."
          examples:
            - Hon
          type: string
      type: object
    MemberTerm:
      description: Member-term association record. Requiredness is not specified.
      properties:
        member_id:
          description: "Member identifier. Example: 187."
          examples:
            - 187
          type: number
        member_term_id:
          description: "Record identifier. Example: 3581716."
          examples:
            - 3581716
          type: number
        term_id:
          description: "Term identifier. Example: 5."
          examples:
            - 5
          type: number
      type: object
    Membership:
      description: Committee membership record fields documented by the reference-data dictionary. Requiredness is not specified.
      properties:
        committee_id:
          description: "Committee identifier. Example: 2567."
          examples:
            - 2567
          type: number
        id:
          description: "Record identifier. Example: 23684."
          examples:
            - 23684
          type: number
        member_id:
          description: "Member identifier. Example: 910."
          examples:
            - 910
          type: number
        membership_id:
          description: "Membership identifier. Example: 38562."
          examples:
            - 38562
          type: number
        post_chi:
          description: "Post name in Chinese. Example: 委員."
          examples:
            - 委員
          type: string
        post_end_date:
          description: "End date of the post. Documented format: YYYY-MM-DDThh:mm:ss (ISO 8601)."
          examples:
            - 2016-10-12T10:00:00
          format: date-time
          type: string
        post_eng:
          description: "Post name in English. Example: Member."
          examples:
            - Member
          type: string
        post_start_date:
          description: "Start date of the post. Documented format: YYYY-MM-DDThh:mm:ss (ISO 8601). Example: 2016-10-12T10:00:00."
          examples:
            - 2016-10-12T10:00:00
          format: date-time
          type: string
        term_id:
          description: "Term identifier. Example: 5."
          examples:
            - 5
          type: number
      type: object
    Session:
      description: Session record fields documented by the reference-data dictionary. Requiredness is not specified.
      properties:
        end_date:
          description: "End date of the session. Documented format: YYYY-MM-DDThh:mm:ss (ISO 8601). Example: 2020-09-30T00:00:00."
          examples:
            - 2020-09-30T00:00:00
          format: date-time
          type: string
        session_code:
          description: "Code of the session. Example: 2019-2020."
          examples:
            - 2019-2020
          type: string
        session_id:
          description: "Session identifier. Example: 20."
          examples:
            - 20
          type: number
        start_date:
          description: "Start date of the session. Documented format: YYYY-MM-DDThh:mm:ss (ISO 8601). Example: 2019-10-01T00:00:00."
          examples:
            - 2019-10-01T00:00:00
          format: date-time
          type: string
        term_id:
          description: "Term identifier. Example: 5."
          examples:
            - 5
          type: number
      type: object
    Term:
      description: Term record fields documented by the reference-data dictionary. Requiredness is not specified.
      properties:
        end_date:
          description: "End date of the term. Documented format: YYYY-MM-DDThh:mm:ss (ISO 8601). Example: 2020-09-30T00:00:00."
          examples:
            - 2020-09-30T00:00:00
          format: date-time
          type: string
        start_date:
          description: "Start date of the term. Documented format: YYYY-MM-DDThh:mm:ss (ISO 8601). Example: 2016-10-01T00:00:00."
          examples:
            - 2016-10-01T00:00:00
          format: date-time
          type: string
        term:
          description: "Term of the Legislative Council. Example: 2016-2020."
          examples:
            - 2016-2020
          type: string
        term_id:
          description: "Term identifier. Example: 5."
          examples:
            - 5
          type: number
      type: object
