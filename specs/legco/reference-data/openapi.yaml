info:
  description: The source bundle provides field dictionaries for terms, sessions, members, committees and committee membership, plus exact published resource URLs. It does not document an API operation contract (HTTP method, query-parameter semantics, authentication, response status codes or complete response envelopes). Accordingly, no executable operations are described. The catalogue's literal resource URLs are not treated as URL templates or evidence of a general HTTP API. The version value is a metadata placeholder, not a publisher API version.
  title: Legislative Council Reference Data
  version: undocumented
