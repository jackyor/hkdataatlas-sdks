      description: Read-only retrieval of the exact publisher-listed JSON resource https://app.legco.gov.hk/ScheduleDB/odata/Tmembership?$expand=Tcommittee&$filter=Tcommittee/term_id+eq+4&$inlinecount=allpages. This is a published data-file link; no additional hosted API or URL template is asserted. Dictionary components describe contextual record fields without establishing the complete payload shape. Authentication is unspecified.
      servers:
        - url: https://app.legco.gov.hk
      responses:
        "200":
          description: Published JSON resource; successful retrieval status is the HTTP representation, availability has not been tested.
          content:
            application/json:
              schema:
                description: Exact published resource retrieval. The complete payload/container shape is not specified; contextual field dictionaries are retained separately under components.
      parameters:
        - name: $expand
