name: Publish SDK packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sdk-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    outputs:
      bundle_id: ${{ steps.bundle.outputs.artifact-id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
      - run: sh ci/install-dagger.sh
      - run: node scripts/ci.mjs
      - run: node scripts/release-check.mjs
      - id: bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdk-release-${{ github.run_attempt }}
          path: |
            dist/typescript/
            dist/python/
            dist/SHA256SUMS
            dist/registry-release.mjs
            dist/release-manifest.json
            reports/dagger.json
  npm:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.bundle_id }}
          merge-multiple: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
      - run: npm install --global npm@12.2.2
      - run: sha256sum --check dist/SHA256SUMS
      - id: prepare
        run: node dist/registry-release.mjs prepare npm
        env:
          GH_TOKEN: ${{ github.token }}
      - if: steps.prepare.outputs.publish == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.prepare.outputs.intent_name }}
          path: dist/release-receipts/npm-intent.json
          retention-days: 90
      - id: publish
        if: steps.prepare.outputs.publish == 'true'
        run: node dist/registry-release.mjs submit npm
      - if: always() && steps.prepare.outcome == 'success'
        run: node dist/registry-release.mjs verify npm
        env:
          SUBMISSION_OUTCOME: ${{ steps.publish.outcome }}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-receipts-${{ github.run_attempt }}
          path: dist/release-receipts/
  pypi:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: pypi
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.bundle_id }}
          merge-multiple: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
      - run: sha256sum --check dist/SHA256SUMS
      - id: prepare
        run: node dist/registry-release.mjs prepare pypi
        env:
          GH_TOKEN: ${{ github.token }}
      - if: steps.prepare.outputs.publish == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.prepare.outputs.intent_name }}
          path: dist/release-receipts/pypi-intent.json
          retention-days: 90
      - id: publish
        if: steps.prepare.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          packages-dir: dist/python/
      - if: always() && steps.prepare.outcome == 'success'
        run: node dist/registry-release.mjs verify pypi
        env:
          SUBMISSION_OUTCOME: ${{ steps.publish.outcome }}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pypi-receipts-${{ github.run_attempt }}
          path: dist/release-receipts/
