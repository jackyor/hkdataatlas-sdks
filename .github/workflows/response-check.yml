name: Optional bounded response check
on:
  workflow_dispatch:
    inputs:
      source:
        description: Family id from specs/manifest.json
        required: true
        default: hkma-banks-branch-locator
      operation:
        description: Declared GET operationId
        required: true
        default: getBanksBranchLocator
      params:
        description: JSON object of declared query parameters
        required: true
        default: '{"lang":"en","pagesize":1}'
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install uv
        run: pipx install uv==0.13.5
      - name: Observe one response
        env:
          SDK_SOURCE: ${{ inputs.source }}
          SDK_OPERATION: ${{ inputs.operation }}
          SDK_PARAMS: ${{ inputs.params }}
        run: uv run --frozen python scripts/response-check.py --source "$SDK_SOURCE" --operation "$SDK_OPERATION" --params "$SDK_PARAMS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: bounded-observation
          path: reports/response-observation.json
